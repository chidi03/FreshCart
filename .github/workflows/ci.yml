name: Checkout API CI

on:
  pull_request:
      branches:
            - main

            permissions:
              contents: read

              jobs:
                build-and-typecheck:
                    name: Build and Typecheck
                        runs-on: ubuntu-latest

                            defaults:
                                  run:
                                          working-directory: checkout-api

                                              steps:
                                                    - name: Check out repository
                                                            uses: actions/checkout@v7

                                                                  - name: Set up Node.js
                                                                          uses: actions/setup-node@v7
                                                                                  with:
                                                                                            node-version: "20"
                                                                                                      cache: npm
                                                                                                                cache-dependency-path: checkout-api/package-lock.json

                                                                                                                      - name: Install dependencies
                                                                                                                              run: npm ci

                                                                                                                                    - name: Build and typecheck
                                                                                                                                            run: npm run build
